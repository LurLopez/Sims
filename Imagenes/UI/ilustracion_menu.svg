<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFDDE3"/>
      <stop offset="1" stop-color="#EAF3EF"/>
    </linearGradient>
    <linearGradient id="pared" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF4E9"/>
      <stop offset="1" stop-color="#F1E4D2"/>
    </linearGradient>
    <linearGradient id="suelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5CFB8"/>
      <stop offset="1" stop-color="#D8B99C"/>
    </linearGradient>
    <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8D877"/>
      <stop offset="1" stop-color="#EFB84F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F4C95D" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F4C95D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- wall panel -->
  <rect x="54" y="36" width="532" height="404" rx="36" fill="url(#pared)"/>

  <!-- window -->
  <path d="M124 360 L124 196 A196 196 0 0 1 516 196 L516 360 Z" fill="url(#cielo)"/>
  <!-- hills -->
  <path d="M124 340 C 190 292, 250 300, 306 336 C 356 296, 430 286, 516 342 L516 360 L124 360 Z" fill="#B7D2B1"/>
  <path d="M124 352 C 196 326, 260 332, 330 352 C 400 326, 468 322, 516 350 L516 360 L124 360 Z" fill="#9CBEA0"/>
  <!-- sun -->
  <circle cx="424" cy="168" r="42" fill="url(#sol)"/>
  <circle cx="424" cy="168" r="58" fill="#F4C95D" opacity="0.16"/>
  <!-- clouds -->
  <path d="M196 182 q 16 -22 40 -10 q 10 -18 30 -8 q 20 2 20 18 z" fill="#FFFFFF" opacity="0.75"/>
  <path d="M330 146 q 10 -14 26 -6 q 8 -12 22 -4 q 14 2 14 12 z" fill="#FFFFFF" opacity="0.55"/>
  <!-- window frame -->
  <path d="M124 360 L124 196 A196 196 0 0 1 516 196 L516 360" fill="none" stroke="#FCF7EF" stroke-width="14" stroke-linecap="round"/>
  <rect x="314" y="64" width="12" height="296" rx="6" fill="#FCF7EF"/>
  <rect x="124" y="236" width="392" height="12" rx="6" fill="#FCF7EF"/>
  <!-- curtains -->
  <path d="M104 96 q 28 6 32 40 l 0 224 q -26 4 -32 -14 z" fill="#E8A48F"/>
  <path d="M536 96 q -28 6 -32 40 l 0 224 q 26 4 32 -14 z" fill="#E8A48F"/>
  <path d="M112 108 q 18 8 20 32 l 0 204 q -14 2 -20 -8 z" fill="#D97F68" opacity="0.45"/>
  <path d="M528 108 q -18 8 -20 32 l 0 204 q 14 2 20 -8 z" fill="#D97F68" opacity="0.45"/>

  <!-- floor -->
  <rect x="54" y="392" width="532" height="132" fill="url(#suelo)"/>
  <rect x="54" y="392" width="532" height="8" fill="#C9A98B" opacity="0.55"/>

  <!-- rug -->
  <ellipse cx="322" cy="482" rx="218" ry="52" fill="#C98D72" opacity="0.35"/>
  <ellipse cx="322" cy="478" rx="202" ry="46" fill="#E8C4B1"/>
  <ellipse cx="322" cy="478" rx="168" ry="34" fill="none" stroke="#D9A78F" stroke-width="5" opacity="0.7"/>

  <!-- desk shadow -->
  <ellipse cx="332" cy="438" rx="160" ry="18" fill="#8C6244" opacity="0.18"/>

  <!-- desk -->
  <rect x="196" y="344" width="266" height="16" rx="8" fill="#B77B5C"/>
  <rect x="212" y="360" width="12" height="76" rx="6" fill="#9D6549"/>
  <rect x="434" y="360" width="12" height="76" rx="6" fill="#9D6549"/>
  <rect x="196" y="336" width="266" height="10" rx="5" fill="#C98D6F"/>

  <!-- plant -->
  <path d="M250 340 q -4 -54 18 -74 q 16 24 6 64 z" fill="#2F6F62"/>
  <path d="M258 340 q 26 -44 52 -44 q -6 34 -42 52 z" fill="#4C9A6A"/>
  <path d="M252 340 q -30 -34 -54 -26 q 8 30 46 38 z" fill="#6FAE7E"/>
  <path d="M250 336 q 20 -16 40 -18" fill="none" stroke="#2F6F62" stroke-width="3" opacity="0.5"/>
  <rect x="232" y="326" width="52" height="20" rx="8" fill="#D97F68"/>
  <path d="M236 346 h44 l-6 42 q -16 8 -32 0 z" fill="#E08A6C"/>
  <rect x="236" y="342" width="44" height="8" rx="4" fill="#C96E57"/>

  <!-- lamp -->
  <rect x="404" y="296" width="10" height="50" rx="5" fill="#7C8B7A"/>
  <path d="M380 296 q 29 -26 58 0 z" fill="#F0C46B"/>
  <ellipse cx="409" cy="346" rx="28" ry="7" fill="#7C8B7A"/>
  <circle cx="409" cy="294" r="26" fill="#F4C95D" opacity="0.22"/>

  <!-- books -->
  <rect x="292" y="322" width="66" height="12" rx="4" fill="#C9524A"/>
  <rect x="298" y="312" width="60" height="12" rx="4" fill="#4C7FB0"/>
  <rect x="288" y="332" width="72" height="12" rx="4" fill="#E3B04B"/>
  <rect x="336" y="306" width="10" height="18" rx="3" fill="#FBF7EF" opacity="0.7"/>

  <!-- mug -->
  <rect x="366" y="326" width="26" height="20" rx="6" fill="#FBF7EF"/>
  <path d="M392 330 q 14 2 10 12 q -4 6 -12 4" fill="none" stroke="#FBF7EF" stroke-width="5" stroke-linecap="round"/>
  <path d="M374 318 q -6 -10 2 -16 M384 318 q -6 -10 2 -16" fill="none" stroke="#D9A78F" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- floating leaves -->
  <path d="M110 330 q 18 -30 40 -24 q -2 28 -28 34 q -8 2 -12 -10 z" fill="#6FAE7E" opacity="0.9"/>
  <path d="M540 300 q -6 -26 16 -38 q 14 18 0 38 q -8 8 -16 0 z" fill="#4C9A6A" opacity="0.8"/>
  <circle cx="104" cy="268" r="7" fill="#E3B04B" opacity="0.8"/>
  <circle cx="552" cy="360" r="5" fill="#D97F68" opacity="0.8"/>
  <circle cx="86" cy="392" r="4" fill="#4C9A6A" opacity="0.6"/>

  <!-- small heart -->
  <path d="M486 244 c -8 -12 -28 -4 -24 10 c 4 12 24 22 24 22 c 0 0 20 -10 24 -22 c 4 -14 -16 -22 -24 -10 z" fill="#E86A4A" opacity="0.9"/>
